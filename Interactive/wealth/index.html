<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surplus Sense</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chart-wrapper">
  <div class="chart-wrap">
    <img id="chartImage" src="wealth1.jpg" alt="Surplus sense chart" width="1400" height="1163">

    <button class="hotspot" id="btn-1lakh" data-target="wealth1.jpg" aria-label="Show chart for Rs 1 lakh surplus"></button>
    <button class="hotspot" id="btn-10lakh" data-target="wealth2.jpg" aria-label="Show chart for Rs 10 lakh surplus"></button>
    <button class="hotspot" id="btn-1crore" data-target="wealth3.jpg" aria-label="Show chart for Rs 1 crore surplus"></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
