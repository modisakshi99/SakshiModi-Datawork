<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smuggling routes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chart-wrap">
  <div class="chart-stage">
    <img id="chart-image" src="DJI1.jpg" alt="Smuggling routes map showing the ship route from Shenzhen/Hong Kong to Singapore to Mumbai and Chennai">

    <button type="button" class="route-hotspot" data-image="DJI1.jpg" data-route="ship"
            style="left:32.29%; top:31%; width:10.93%; height:3.28%;"
            aria-pressed="true" aria-label="Show ship route"></button>

    <button type="button" class="route-hotspot" data-image="DJI2.jpg" data-route="air"
            style="left:44.57%; top:31%; width:10.93%; height:3.28%;"
            aria-pressed="false" aria-label="Show air route"></button>

    <button type="button" class="route-hotspot" data-image="DJI3.jpg" data-route="land"
            style="left:56.86%; top:31%; width:10.93%; height:3.28%;"
            aria-pressed="false" aria-label="Show land route"></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
