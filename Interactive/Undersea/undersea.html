<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaks Undersea</title>
    <link rel="stylesheet" href="undersea.css">
  
</head>
<body>
    <div class="chart-wrapper">
         
        <img
            src="Undersea_before.jpg"
            alt="Breaks Undersea – The protection disappears long before the cable ends"
            class="chart-image"
            id="chartImage"
        >
       
        <div class="zones-overlay" id="zonesOverlay"></div>
        <div class="tooltip" id="tooltip">
            <div class="tooltip-section">
                <p class="tooltip-label">Protection</p>
                <p class="tooltip-value" id="tooltip-protection"></p>
            </div>
            <div class="tooltip-section">
                <p class="tooltip-label">What can break them</p>
                <p class="tooltip-value" id="tooltip-break"></p>
            </div>
        </div>
    </div>
    <script src="undersea.js"></script>
</body>
</html>
