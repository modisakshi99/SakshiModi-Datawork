<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State of affairs — Udaan funding history</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="chart-frame" id="chartFrame">

<div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true">

  <div class="tooltip-amount" id="ttAmount"></div>
  <div class="tooltip-desc" id="ttDesc"></div>
</div>

<script src="script.js"></script>
</body>
</html>
